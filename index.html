<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invocation du Démon Suprême - Halloween</title>
    <style>
        body {
            background-color: #050505;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #800000;
            animation: pulse 2s infinite;
        }
        #status {
            font-size: 1.5rem;
            margin: 20px;
            color: #ffa500;
            text-shadow: 0 0 10px #ff4500;
        }
        #config-box {
            background: rgba(20, 0, 0, 0.9);
            border: 2px solid #ff0000;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            z-index: 10;
        }
        input[type="password"] {
            padding: 10px;
            width: 300px;
            background: #1a0000;
            border: 1px solid #ff3333;
            color: #fff;
            font-family: monospace;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #800000;
            color: #fff;
            border: 1px solid #ff0000;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            margin-left: 10px;
        }
        button:hover {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        .hidden {
            display: none !important;
        }
        #transcription {
            font-style: italic;
            color: #aaa;
            max-width: 600px;
            margin-top: 20px;
            font-size: 1.2rem;
        }
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px #ff0000; }
            50% { transform: scale(1.03); text-shadow: 0 0 40px #ff3300, 0 0 60px #990000; }
            100% { transform: scale(1); text-shadow: 0 0 20px #ff0000; }
        }
    </style>
</head>
<body>

    <!-- Panneau de configuration pour la clé API Groq -->
    <div id="config-box">
        <h2>Configuration Infernale (Groq)</h2>
        <p>Entre ta clé API Groq pour réveiller la bête :</p>
        <input type="password" id="api-key-input" placeholder="Colle ta clé API Groq ici...">
        <button id="start-btn">Commencer le rituel</button>
    </div>

    <!-- Interface principale -->
    <div id="main-interface" class="hidden">
        <h1>🔥 DÉMON SUPRÊME 🔥</h1>
        <div id="status">Statut : Endormi (Dis "J'invoque le démon suprême")</div>
        <div id="transcription">... Le silence règne dans les abysses ...</div>
    </div>

    <script>
        let groqApiKey = "";
        let isAwake = false;
        let recognition = null;
        let audioCtx = null;

        // Éléments DOM
        const configBox = document.getElementById('config-box');
        const mainInterface = document.getElementById('main-interface');
        const apiKeyInput = document.getElementById('api-key-input');
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');
        const transcriptionDiv = document.getElementById('transcription');

        // Initialiser l'AudioContext pour les effets sonores (bruit de chaleur/explosion)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Effet sonore de chaleur / explosion / mastication de bonbon
        function jouerSonMagique() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const bufferSize = audioCtx.sampleRate * 1.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5);

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noise.start();
        }

        // Synthèse Vocale avec effet de voix grave/caverneuse
        function parlerDemon(texte) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texte);
            utterance.pitch = 0.1; // Voix la plus grave possible
            utterance.rate = 0.75; // Lent et menaçant
            utterance.volume = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(v => v.lang.includes('fr') && (v.name.includes('Google') || v.name.includes('Thomas') || v.name.includes('Audrey')));
            if (frenchVoice) {
                utterance.voice = frenchVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Démarrer l'application après saisie de la clé
        startBtn.addEventListener('click', () => {
            groqApiKey = apiKeyInput.value.trim();
            if (!groqApiKey) {
                alert("Entre une clé API Groq valide pour invoquer le démon !");
                return;
            }

            configBox.classList.add('hidden');
            mainInterface.classList.remove('hidden');

            initAudio();
            demarrerReconnaissanceVocale();
            lancerMinuteursChronometres();
        });

        // Appel à l'API Groq
        async function demanderAuDemon(messageUtilisateur) {
            statusDiv.textContent = "Statut : Le démon rumine sa réponse...";
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {
                                role: "system",
                                content: "Tu es un démon suprême invoqué pour Halloween. Tu réponds toujours d'une voix théâtrale, extrêmement grave, ténébreuse, menaçante mais captivante. Tu as toujours faim de bonbons et d'âmes. Tes réponses doivent être courtes (maximum 2 phrases)."
                            },
                            {
                                role: "user",
                                content: messageUtilisateur
                            }
                        ],
                        temperature: 1.0,
                        max_tokens: 100
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const reponseDemon = data.choices[0].message.content;
                    statusDiv.textContent = "Statut : RÉVEILLÉ ET AFFAMÉ 🔥";
                    parlerDemon(reponseDemon);
                    transcriptionDiv.textContent = `Démon : "${reponseDemon}"`;
                } else {
                    throw new Error("Réponse vide de Groq");
                }

            } catch (error) {
                console.error("Erreur Groq :", error);
                parlerDemon("Une force occulte bloque mes pouvoirs... réessaie, mortel.");
                statusDiv.textContent = "Statut : RÉVEILLÉ ET AFFAMÉ 🔥";
            }
        }

        // Configuration de la reconnaissance vocale continue
        function demarrerReconnaissanceVocale() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Ton navigateur ne supporte pas la reconnaissance vocale. Utilise Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const dernierResultat = event.results[event.results.length - 1];
                const textePrononce = dernierResultat[0].transcript.trim().toLowerCase();
                transcriptionDiv.textContent = `Toi : "${textePrononce}"`;

                // 1. Invocation
                if (!isAwake && textePrononce.includes("j'invoque le démon suprême")) {
                    isAwake = true;
                    statusDiv.textContent = "Statut : RÉVEILLÉ ET AFFAMÉ 🔥";
                    jouerSonMagique();
                    parlerDemon("Comment oses-tu me déranger dans mon sommeil, mortel insensifié ?");
                    return;
                }

                if (!isAwake) return;

                // 2. Désinvocation
                if (textePrononce.includes("mon suprême disparaît") || textePrononce.includes("mon suprême disparais")) {
                    isAwake = false;
                    statusDiv.textContent = "Statut : Endormi (Dis 'J'invoque le démon suprême')";
                    parlerDemon("Je retourne dans les abysses... pour l'instant.");
                    transcriptionDiv.textContent = "... Le silence règne ...";
                    return;
                }

                // 3. Discussion avec Groq
                demanderAuDemon(textePrononce);
            };

            recognition.onerror = (event) => {
                console.warn("Erreur de micro :", event.error);
            };

            recognition.onend = () => {
                try {
                    recognition.start();
                } catch (e) {}
            };

            recognition.start();
        }

        // Minuteurs automatiques (Toutes les 2 et 3 minutes)
        function lancerMinuteursChronometres() {
            setInterval(() => {
                if (isAwake) {
                    jouerSonMagique();
                    const rires = [
                        "Mouhahahaha ! Ton heure approche...",
                        "Hehehe... je sens la peur en toi.",
                        "*Le feu enfle dans les ténèbres*"
                    ];
                    const texteAleatoire = rires[Math.floor(Math.random() * rires.length)];
                    parlerDemon(texteAleatoire);
                }
            }, 120000); // 2 minutes

            setInterval(() => {
                if (isAwake) {
                    const menaces = [
                        "Alors... as-tu trouvé des bonbons délicieux pour apaiser ma faim éternelle ?",
                        "Le temps presse, mortel... Apporte-moi des offrandes sucrées ou subis ma colère.",
                        "Mes flammes faiblissent... nourris-moi !"
                    ];
                    const texteMenace = menaces[Math.floor(Math.random() * menaces.length)];
                    parlerDemon(texteMenace);
                }
            }, 180000); // 3 minutes
        }

        // Interaction tactile (Toucher l'écran pour donner un bonbon)
        document.body.addEventListener('click', (e) => {
            if (!isAwake) return;
            
            jouerSonMagique();
            const reactionsBonbon = [
                "Mmm... délicieux... Encore !",
                "Ah, une offrande sucrée... C'est tout ce que tu as ?",
                "Délicieux, croquant... Donne-m'en d'autres !"
            ];
            const reaction = reactionsBonbon[Math.floor(Math.random() * reactionsBonbon.length)];
            parlerDemon(reaction);
        });
    </script>
</body>
</html>
